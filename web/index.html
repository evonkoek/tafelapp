<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f855a">
<title>TafelApp</title>
<style>
  :root { --bg:#f4faf2; --fg:#1a1a1a; --muted:#6b7280; --accent:#2f855a; --accent-fg:#fff;
          --card:#e5f1e0; --goed:#16a34a; --fout:#dc2626; --rand:#bcd5b4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1a14; --fg:#f0f0f0; --muted:#9ca3af; --accent:#68d391; --accent-fg:#0b1f14;
            --card:#1b2b22; --goed:#4ade80; --fout:#f87171; --rand:#2f4a3a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:16px/1.35 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg);
         padding:max(.5rem, env(safe-area-inset-top)) .9rem max(.5rem, env(safe-area-inset-bottom)); }
  main { max-width:30rem; margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:.55rem; }
  h1 { margin:0; font-size:1.3rem; }
  h2 { margin:.2rem 0 0; font-size:1.1rem; }
  #status { margin:0; color:var(--muted); font-size:.9rem; min-height:1.3rem; }
  #status.waarschuwing { color:var(--fout); font-weight:600; }
  button { font:inherit; border:0; border-radius:.9rem; padding:.9rem 1rem; cursor:pointer;
           background:var(--accent); color:var(--accent-fg); touch-action:manipulation; }
  button:disabled { opacity:.45; cursor:default; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--rand); }
  .rij { display:flex; gap:.6rem; }
  .rij > * { flex:1; }
  input[type="text"] { font:inherit; width:100%; padding:.8rem 1rem; border-radius:.9rem;
                       border:2px solid var(--rand); background:var(--card); color:var(--fg); }
  input[type="text"]:focus { outline:none; border-color:var(--accent); }
  .spelers { display:flex; flex-wrap:wrap; gap:.5rem; }
  .spelers button { padding:.45rem .9rem; border-radius:2rem; background:var(--card); color:var(--fg);
                    border:1px solid var(--rand); font-size:.95rem; }
  .chips { display:grid; grid-template-columns:repeat(5, 1fr); gap:.5rem; }
  .chips button { background:var(--card); color:var(--fg); border:2px solid var(--rand); padding:.8rem 0; font-weight:600; }
  .chips button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  select { font:inherit; padding:.7rem; border-radius:.7rem; border:1px solid var(--rand); background:var(--card); color:var(--fg); }
  label { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .voortgang { height:.5rem; background:var(--card); border-radius:1rem; margin-top:1.2rem; }
  #balk { height:100%; width:0; background:var(--accent); border-radius:1rem; position:relative; transition:width .45s cubic-bezier(.3,1.4,.5,1); }
  #teller { margin:0; color:var(--muted); text-align:center; font-size:.9rem; }
  .vraag { font-size:3rem; font-weight:700; text-align:center; margin-top:.5rem; }
  .antwoord { font-size:2.4rem; font-weight:700; text-align:center; min-height:4rem; padding:.4rem;
              border-radius:1rem; background:var(--card); border:3px solid var(--rand); }
  .antwoord.goed { border-color:var(--goed); color:var(--goed); }
  .antwoord.fout { border-color:var(--fout); color:var(--fout); }
  #feedback { min-height:1.6rem; text-align:center; font-weight:600; }
  .numpad { display:grid; grid-template-columns:repeat(3, 1fr); gap:.6rem; margin-top:auto; }
  .numpad button { font-size:1.6rem; padding:1rem 0; background:var(--card); color:var(--fg); border:1px solid var(--rand); }
  .numpad button.ok { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .score { font-size:3rem; font-weight:700; text-align:center; margin:.5rem 0 0; }
  #bericht { text-align:center; margin:0; font-size:1.2rem; }
  ul { padding-left:1.2rem; margin:.3rem 0; }
  .klein { color:var(--muted); font-size:.9rem; text-align:center; margin:.2rem 0; }
  .kaart { background:var(--card); border:1px solid var(--rand); border-radius:1rem; padding:.8rem 1rem; }
  .kaart h3 { margin:0 0 .5rem; font-size:1rem; }
  .cijfers { display:grid; grid-template-columns:repeat(4, 1fr); gap:.3rem; text-align:center; }
  .cijfers b { display:block; font-size:1.3rem; }
  .cijfers span { font-size:.75rem; color:var(--muted); }
  .staven { display:flex; gap:.3rem; height:5.5rem; margin:.7rem 0 .3rem; }
  .stavo { flex:1; display:flex; flex-direction:column; align-items:center; font-size:.65rem; color:var(--muted); }
  .vlak { flex:1; width:100%; display:flex; align-items:flex-end; }
  .staaf { width:100%; background:var(--accent); border-radius:.3rem .3rem 0 0; min-height:3px; }
  .tekstknop { background:none; color:var(--muted); text-decoration:underline; padding:.4rem 0 0; font-size:.85rem; width:100%; }

  .kop { display:flex; align-items:center; gap:.8rem; }
  .kop h1 { color:var(--accent); }
  #panda { width:4.4rem; height:4.4rem; flex:none; transform-origin:50% 90%; animation:zweef 3.2s ease-in-out infinite; }
  #panda .mond-triest { display:none; }
  #panda.blij { animation:hop .7s ease; }
  #panda.triest { animation:schud .6s ease; }
  #panda.triest .mond-blij { display:none; }
  #panda.triest .mond-triest { display:inline; }
  #looper { position:absolute; right:-.7rem; top:-1.25rem; font-size:1.3rem; animation:zweef 1.2s ease-in-out infinite; }
  .reeks { text-align:center; min-height:1.4rem; font-weight:700; color:var(--accent); }
  .reeks.nieuw { animation:pop .4s ease; }
  .vraag.pop { animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
  .antwoord.goed { animation:hop .6s ease; }
  .antwoord.fout { animation:schud .5s ease; }
  .sterren { text-align:center; font-size:2.2rem; margin:.2rem 0; letter-spacing:.2rem; }
  .sterren span { display:inline-block; animation:pop .5s backwards; }
  button { transition:transform .12s; }
  button:active { transform:scale(.94); }
  .chips button[aria-pressed="true"] { transform:scale(1.07); }
  #confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
  .snipper { position:absolute; left:50%; top:42%; font-size:1.6rem; animation:vlieg 1.3s ease-out forwards; }
  @keyframes zweef { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-4px) rotate(2deg); } }
  @keyframes hop { 0% { transform:translateY(0) scale(1); } 35% { transform:translateY(-16px) scale(1.12); } 70% { transform:translateY(0) scale(.96); } 100% { transform:translateY(0) scale(1); } }
  @keyframes schud { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-9deg); } 40% { transform:rotate(8deg); } 60% { transform:rotate(-6deg); } 80% { transform:rotate(4deg); } }
  @keyframes pop { 0% { transform:scale(.4); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  @keyframes vlieg {
    0% { transform:translate(-50%,0) scale(.3) rotate(0); opacity:1; }
    55% { transform:translate(calc(-50% + var(--x)), var(--y)) scale(1.1) rotate(var(--r)); opacity:1; }
    100% { transform:translate(calc(-50% + var(--x)), calc(var(--y) + 40vmin)) scale(.9) rotate(calc(var(--r) * 2)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  .kop button { margin-left:auto; padding:.4rem .6rem; font-size:1.1rem; border-radius:.7rem; }
  #panda { width:3.2rem; height:3.2rem; cursor:pointer; }
  h2 { font-size:1rem; margin:0; }
  #status { font-size:.8rem; min-height:1rem; }
  .chips { gap:.4rem; } .chips button { padding:.55rem 0; }
  .sec { padding:.55rem 1rem; }
  input[type="text"] { padding:.6rem .9rem; }
  .vraag { font-size:clamp(2.2rem, 7dvh, 3rem); margin-top:0; line-height:1.1; }
  .antwoord { font-size:2rem; min-height:clamp(2.8rem, 7dvh, 3.6rem); padding:.2rem; }
  #feedback { min-height:1.3rem; font-size:.95rem; }
  .numpad { gap:.4rem; }
  .numpad button { font-size:1.4rem; padding:clamp(.5rem, 1.9dvh, 1rem) 0; }
  .info { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--muted); }
  #teller { margin:0; }
  .reeks { min-height:0; text-align:right; }
  .score { font-size:2.2rem; margin:0; }
  .sterren { font-size:1.8rem; margin:0; }
  #bericht { font-size:1.05rem; }
  #fouten { max-height:5.5rem; overflow:auto; font-size:.9rem; }
  #fouten h2 { font-size:.9rem; }
  #voortgang-start .staven { display:none; }
  #voortgang-klaar .staven { height:3rem; margin:.4rem 0 .2rem; }
  .kaart { padding:.5rem .8rem; }
  #scherm-klaar:not([hidden]) { display:flex; flex-direction:column; gap:.5rem; flex:1; }
  #scherm-klaar > .rij { margin-top:auto !important; }
  .antwoord.goed { animation:hop .6s ease, gloed 1s ease; }
  body.wiebel main { animation:wiebel .45s; }
  #toneel { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:.8rem; overflow:hidden; padding:1rem; }
  #figuur { width:min(60vw, 38dvh); height:auto; overflow:visible; }
  #bubbel { max-width:20rem; text-align:center; font-size:1.25rem; font-weight:700; background:var(--card);
            border:2px solid var(--rand); border-radius:1.2rem; padding:.7rem 1rem; animation:pop .4s ease; }
  #bubbel:empty { display:none; }
  #toneel-knop { min-width:12rem; }
  .modus-intro #pop { animation:inloop 2.2s ease-out both; }
  .modus-finale #pop { animation:opkomen .6s cubic-bezier(.3,1.6,.5,1) both; }
  .arm, .been { transform-box:fill-box; } .arm { transform-origin:50% 8%; } .been { transform-origin:50% 5%; }
  #figuur-kop .mond-triest { display:none; }
  #figuur.loop { animation:bob .28s ease-in-out infinite; }
  #figuur.loop .been.l, #figuur.dans .been.l, #figuur.feest .been.l { animation:stap .3s ease-in-out infinite alternate; }
  #figuur.loop .been.r, #figuur.dans .been.r, #figuur.feest .been.r { animation:stap .3s ease-in-out infinite alternate-reverse; }
  #figuur.dans { animation:dansen .7s ease-in-out infinite; }
  #figuur.dans .arm.l, #figuur.feest .arm.l { animation:armL .35s ease-in-out infinite alternate; }
  #figuur.dans .arm.r, #figuur.feest .arm.r { animation:armR .35s ease-in-out infinite alternate; }
  #figuur.wenk { animation:zweef 2.4s ease-in-out infinite; }
  #figuur.wenk .arm.r { animation:wuif .45s ease-in-out infinite alternate; }
  #figuur.feest { animation:sprong .55s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes stap { from { transform:rotate(-18deg); } to { transform:rotate(18deg); } }
  @keyframes dansen { 0%,100% { transform:rotate(-6deg) translateY(0); } 50% { transform:rotate(6deg) translateY(-16px); } }
  @keyframes armL { from { transform:rotate(110deg); } to { transform:rotate(155deg); } }
  @keyframes armR { from { transform:rotate(-110deg); } to { transform:rotate(-155deg); } }
  @keyframes wuif { from { transform:rotate(-125deg); } to { transform:rotate(-165deg); } }
  @keyframes sprong { 0%,100% { transform:translateY(0) scale(1.03,.97); } 50% { transform:translateY(-32px) scale(.97,1.03); } }
  @keyframes inloop { from { transform:translateX(-110vw); } to { transform:translateX(0); } }
  @keyframes opkomen { from { transform:scale(0) rotate(-40deg); } to { transform:scale(1) rotate(0); } }
  @keyframes gloed { from { box-shadow:0 0 0 0 var(--goed); } to { box-shadow:0 0 0 22px transparent; } }
  @keyframes wiebel { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }

  .chips button { display:flex; flex-direction:column; align-items:center; line-height:1.15; padding:.4rem 0; }
  .chips button b { font-size:1.15rem; } .chips button small { font-size:.6rem; opacity:.85; letter-spacing:0; }
  #scherm-levels:not([hidden]) { display:flex; flex-direction:column; gap:.5rem; flex:1; }
  .levels { display:flex; flex-direction:column; gap:.5rem; }
  .levelknop { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.7rem; text-align:left;
               padding:.8rem 1rem; background:var(--card); color:var(--fg); border:2px solid var(--rand); }
  .levelknop small { color:var(--muted); }
  .levelknop:disabled { opacity:.5; }
  .opties { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:auto; }
  .opties button { font-size:1.8rem; font-weight:700; padding:clamp(.9rem, 4.5dvh, 1.7rem) 0; background:var(--card);
                   color:var(--fg); border:2px solid var(--rand); }
  .opties button:disabled { opacity:1; }
  .opties button.goed { background:var(--goed); color:#fff; border-color:var(--goed); animation:hop .6s ease; }
  .opties button.fout { background:var(--fout); color:#fff; border-color:var(--fout); animation:schud .5s ease; }
  .tijd { height:.7rem; background:var(--card); border-radius:1rem; overflow:hidden; }
  #tijdvul { height:100%; width:100%; background:var(--accent); }
  .modus-intro #figuur, .modus-finale #aap { display:none; }
  #toneel.modus-intro { background:linear-gradient(180deg, #d6efff 0%, #5b9bd5 100%); }
  #aap { width:min(58vw, 34dvh); height:auto; overflow:visible; }
  #aap .beenA { transform-box:fill-box; transform-origin:50% 5%; }
  #aap .staart { transform-origin:150px 238px; animation:staart 1s ease-in-out infinite alternate; }
  #aap.loop { animation:bob .28s ease-in-out infinite; }
  #aap.loop .beenA.l, #aap.dans .beenA.l { animation:stap .3s ease-in-out infinite alternate; }
  #aap.loop .beenA.r, #aap.dans .beenA.r { animation:stap .3s ease-in-out infinite alternate-reverse; }
  #aap.dans { animation:dansen .6s ease-in-out infinite; }
  #aap.dans .armA.l { animation:zwaaiL .3s ease-in-out infinite alternate; }
  #aap.dans .armA.r { animation:zwaaiR .3s ease-in-out infinite alternate; }
  #aap.klap { animation:zweef 1.4s ease-in-out infinite; }
  #aap.klap .armA.l { animation:klapL .32s ease-in-out infinite alternate; }
  #aap.klap .armA.r { animation:klapR .32s ease-in-out infinite alternate; }
  @keyframes staart { from { transform:rotate(-12deg); } to { transform:rotate(12deg); } }
  @keyframes zwaaiL { from { transform:rotate(-5deg); } to { transform:rotate(-35deg); } }
  @keyframes zwaaiR { from { transform:rotate(5deg); } to { transform:rotate(35deg); } }
  @keyframes klapL { from { transform:rotate(-8deg); } to { transform:rotate(-58deg); } }
  @keyframes klapR { from { transform:rotate(8deg); } to { transform:rotate(58deg); } }
</style>
</head>
<body>
<main>
  <header class="kop">
    <svg id="panda" viewBox="0 0 100 100" role="img" aria-label="Panda">
      <circle cx="50" cy="50" r="50" fill="#cfe8cf"/>
      <circle cx="24" cy="24" r="13" fill="#222"/><circle cx="76" cy="24" r="13" fill="#222"/>
      <ellipse cx="50" cy="56" rx="38" ry="34" fill="#fff" stroke="#222" stroke-width="3"/>
      <ellipse cx="34" cy="50" rx="10" ry="13" fill="#222" transform="rotate(20 34 50)"/>
      <ellipse cx="66" cy="50" rx="10" ry="13" fill="#222" transform="rotate(-20 66 50)"/>
      <circle cx="35" cy="49" r="4" fill="#fff"/><circle cx="65" cy="49" r="4" fill="#fff"/>
      <circle cx="36" cy="50" r="1.8" fill="#222"/><circle cx="64" cy="50" r="1.8" fill="#222"/>
      <ellipse cx="50" cy="63" rx="6" ry="4.5" fill="#222"/>
      <path class="mond-blij" d="M40 72 Q50 83 60 72" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <path class="mond-triest" d="M41 79 Q50 70 59 79" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>TafelApp 🎋</h1>
      <p id="status">Python wordt geladen…</p>
    </div>
    <button id="geluid" class="sec" type="button" aria-label="Geluid aan of uit">🔊</button>
  </header>

  <section id="scherm-start" style="display:flex; flex-direction:column; gap:.6rem">
    <h2>Wie ben jij?</h2>
    <input id="naam" type="text" maxlength="20" placeholder="Vul je naam in" autocomplete="off"
           enterkeyhint="done" aria-label="Je naam">
    <div id="spelers" class="spelers" hidden></div>
    <div id="voortgang-start"></div>

    <h2>Kies een tafel</h2>
    <div id="tafels" class="chips"></div>
  </section>

  <section id="scherm-levels" hidden>
    <button id="terug" class="tekstknop" type="button" style="text-align:left">‹ Terug naar tafels</button>
    <h2 id="levels-kop"></h2>
    <div id="levels" class="levels"></div>
  </section>

  <section id="scherm-vraag" hidden style="flex:1; display:none; flex-direction:column; gap:.45rem">
    <div class="voortgang"><div id="balk"><span id="looper">🐼</span></div></div>
    <div class="info"><span id="teller"></span><div id="reeks" class="reeks"></div></div>
    <div class="tijd" id="tijdbalk" hidden><div id="tijdvul"></div></div>
    <div id="vraag" class="vraag" aria-live="polite"></div>
    <div id="antwoord" class="antwoord" aria-live="polite"></div>
    <div id="feedback"></div>
    <div class="opties" id="opties" hidden></div>
    <div class="numpad" id="numpad"></div>
    <button id="stop" class="tekstknop" type="button">Stoppen</button>
  </section>

  <section id="scherm-klaar" hidden>
    <h2 id="klaar-kop">Klaar!</h2>
    <p class="score" id="score"></p>
    <p class="sterren" id="sterren"></p>
    <p id="bericht"></p>
    <p id="vergelijk" class="klein"></p>
    <div id="fouten"></div>
    <div id="voortgang-klaar" style="margin-top:.8rem"></div>
    <div class="rij" style="margin-top:1rem">
      <button id="opnieuw" type="button">Nog een keer</button>
      <button id="andere" class="sec" type="button">Levels</button>
    </div>
  </section>
</main>
<div id="toneel" hidden>
  <div id="pop">
    <svg id="aap" viewBox="0 0 220 290" aria-hidden="true">
      <path class="staart" d="M150 238 C214 252 222 168 178 176" fill="none" stroke="#8a5230" stroke-width="13" stroke-linecap="round"/>
      <g class="beenA l"><ellipse cx="82" cy="262" rx="20" ry="22" fill="#8a5230"/><ellipse cx="82" cy="274" rx="15" ry="9" fill="#f6d3aa"/></g>
      <g class="beenA r"><ellipse cx="138" cy="262" rx="20" ry="22" fill="#8a5230"/><ellipse cx="138" cy="274" rx="15" ry="9" fill="#f6d3aa"/></g>
      <ellipse cx="110" cy="205" rx="48" ry="58" fill="#8a5230"/>
      <ellipse cx="110" cy="212" rx="31" ry="40" fill="#f9dfbd"/>
      <path d="M110 228 C92 214 96 197 110 205 C124 197 128 214 110 228 Z" fill="#ff6fa5"/>
      <g class="armA l" style="transform-origin:64px 168px">
        <ellipse cx="60" cy="198" rx="11" ry="33" fill="#8a5230"/>
        <g transform="translate(32 192) scale(.5)">
          <ellipse cx="50" cy="112" rx="30" ry="26" fill="#fff" stroke="#222" stroke-width="3"/>
          <ellipse cx="32" cy="132" rx="10" ry="9" fill="#222"/><ellipse cx="68" cy="132" rx="10" ry="9" fill="#222"/>
          <g id="aap-pandakop"></g>
        </g>
        <circle cx="58" cy="230" r="11" fill="#f6d3aa"/>
      </g>
      <g class="armA r" style="transform-origin:156px 168px">
        <ellipse cx="160" cy="198" rx="11" ry="33" fill="#8a5230"/>
        <circle cx="162" cy="230" r="11" fill="#f6d3aa"/>
      </g>
      <circle cx="54" cy="104" r="18" fill="#8a5230"/><circle cx="54" cy="104" r="11" fill="#f6d3aa"/>
      <circle cx="166" cy="104" r="18" fill="#8a5230"/><circle cx="166" cy="104" r="11" fill="#f6d3aa"/>
      <circle cx="110" cy="100" r="54" fill="#8a5230"/>
      <path d="M96 54 Q90 32 104 40 Q108 26 116 42 Q126 34 122 56 Z" fill="#8a5230"/>
      <circle cx="92" cy="96" r="24" fill="#f6d3aa"/><circle cx="128" cy="96" r="24" fill="#f6d3aa"/>
      <ellipse cx="110" cy="122" rx="32" ry="26" fill="#f6d3aa"/>
      <ellipse cx="92" cy="98" rx="10" ry="12" fill="#fff"/><ellipse cx="128" cy="98" rx="10" ry="12" fill="#fff"/>
      <circle cx="93" cy="100" r="6.5" fill="#a0521d"/><circle cx="127" cy="100" r="6.5" fill="#a0521d"/>
      <circle cx="93" cy="100" r="3.2" fill="#222"/><circle cx="127" cy="100" r="3.2" fill="#222"/>
